<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URL Generator</title>
  <link rel="stylesheet" href="other.css">
</head>
<body>
  <h1>URL Generator</h1>

  <h2>Enter a sample URL containing the page number:</h2>
  <input id="base-url-input" type="text" size="70"
         placeholder="https://example.com/articles/page/3?sort=new">

  <h2>Detected page number:</h2>
  <input id="detected-number" type="number" readonly style="width: 120px">
  <span id="detection-info"></span>

  <h2>Generate range:</h2>
  <div class="centerobj">
    <h3>From:</h3> 
    <input id="range-start" type="number" value="1" style="width: 90px">
    <h3>To:</h3> 
    <input id="range-end" type="number" value="10" style="width: 90px">
    <h3>Step:</h3> 
    <input id="range-step" type="number" value="1" min="1" style="width: 70px">
    <h3>Pad 0s:</h3> 
    <input id="pad-length" type="number" min="0" max="10" placeholder="off" style="width: 70px">
  </div>
  <br><br>
  <div class="centerbtns">
    <button id="generate-urls-button">Generate URLs</button>
    <button id="copy-urls-button">Copy to Clipboard</button>
    <button id="download-urls-button">Download Files</button>
    <span id="status"></span>
  </div>

  <br><br>
  <div class="centerobj">
    <textarea id="urls-textarea" readonly rows="15" cols="85"></textarea>
  </div>

  <!-- JSZip for creating the ZIP file -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
const $ = (id) => document.getElementById(id);

function detectPageNumber(url) {
  const candidates = [];
  const re = /\d+/g;
  let m;
  while ((m = re.exec(url)) !== null) {
    const numStr = m[0];
    const start = m.index;
    const before = url.slice(0, start);
    const after = url.slice(start + numStr.length);
    let score = 0;

    // Strongest signal: last path segment before a file extension, e.g. /1.webp
    if (/\/\d+\.[a-z0-9]{2,5}(?:[?#].*)?$/i.test(url)) {
      if (new RegExp('/' + numStr.replace(/\d/g, '\\d') + '\\.[a-z0-9]{2,5}([?#]|$)', 'i').test(url.slice(start - 1))) {
        score += 20;
      }
    }

    // Page-like query params or keywords: ?page=3, /chapter-5
    if (/(page|p|pg|pn|chap|chapter|section|start|offset|index|idx)[=/_-]?$/i.test(before)) score += 10;
    else if (/\/$/i.test(before)) score += 4;
    else if (/=$/.test(before)) score += 3;

    // Penalize long numbers (IDs are usually long; chapters are short)
    if (numStr.length >= 6) score -= 8;

    // Penalize ports and TLDs
    if (/:$/.test(before)) score -= 10;
    if (/^(\.com|\.net|\.org|\.io)/i.test(after)) score -= 10;

    // Bonus for being at end or followed by separator/extension
    if (after === '' || /^[/?&#]/.test(after)) score += 2;
    if (/^\.[a-z0-9]{2,5}([?#]|$)/i.test(after)) score += 6;

    candidates.push({ numStr, start, end: start + numStr.length, score });
  }
  if (!candidates.length) return null;
  candidates.sort((a, b) => b.score - a.score || b.start - a.start);
  const best = candidates[0];
  if (best.score <= 0) return null;
  return {
    value: parseInt(best.numStr, 10),
    numStr: best.numStr,
    start: best.start,
    end: best.end
  };
}

$('base-url-input').addEventListener('input', () => {
  const det = detectPageNumber($('base-url-input').value.trim());
  $('detected-number').value = det ? det.value : '';
  $('detection-info').textContent = det
    ? 'Found "' + det.numStr + '" — it will be replaced.'
    : 'No page number detected.';
});

$('generate-urls-button').addEventListener('click', () => {
  const baseURL = $('base-url-input').value.trim();
  const start = parseInt($('range-start').value, 10);
  const end = parseInt($('range-end').value, 10);
  const step = Math.max(1, parseInt($('range-step').value, 10) || 1);
  const pad = parseInt($('pad-length').value, 10) || 0;
  const status = $('status');

  const det = detectPageNumber(baseURL);
  if (!det) {
    status.textContent = 'Could not detect a page number. Include one (e.g. ?page=1).';
    return;
  }
  if (isNaN(start) || isNaN(end) || start > end) {
    status.textContent = 'Invalid range: start must be ≤ end.';
    return;
  }
  if (end - start > 100000) {
    status.textContent = 'Range too large (max 100,000 URLs).';
    return;
  }

  let urls = '';
  let count = 0;
  for (let i = start; i <= end; i += step) {
    const num = String(i).padStart(Math.max(pad, det.numStr.length), '0');
    urls += baseURL.slice(0, det.start) + num + baseURL.slice(det.end) + '\n\n';
    count++;
  }

  $('urls-textarea').value = urls;
  status.textContent = 'Replaced "' + det.numStr + '" → generated ' + count + ' URL' + (count === 1 ? '' : 's') + '.';
});

$('copy-urls-button').addEventListener('click', async () => {
  const text = $('urls-textarea').value;
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    $('urls-textarea').select();
    document.execCommand('copy');
  }
  $('status').textContent = 'Copied to clipboard!';
});
//Copies the links to clipboard then takes you to external website for easier download
$('download-urls-button').addEventListener('click', async () => {
  const urls = $('urls-textarea').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!urls.length) {
    $('status').textContent = 'No URLs to copy.';
    return;
  }

  // Copy URLs to clipboard (one per line, no blank lines)
  try {
    await navigator.clipboard.writeText(urls.join('\n'));
  } catch {
    $('urls-textarea').select();
    document.execCommand('copy');
  }

  // Open the bulk downloader site
  window.open('https://www.orderproanalytics.com/image-downloader/upload', '_blank');

  $('status').textContent = 'Copied ' + urls.length + ' URLs. Paste them into the opened tab.';
});
  </script>
</body>
</html>
